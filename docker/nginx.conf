server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx only knows it's listening on :80 inside the container -- it has no
    # idea Docker maps that to a different host port (e.g. :3100). Without this,
    # nginx's automatic directory-without-trailing-slash redirect emits an
    # absolute Location header missing the real port, sending browsers to the
    # wrong port entirely. A relative redirect lets the browser resolve it
    # against whatever origin/port it actually used.
    absolute_redirect off;

    # Next's static export writes routes as flat route.html files; a route that
    # also has sub-routes gets both route.html and a route/ directory. $uri.html
    # must be tried before $uri/, or try_files commits to the directory, finds no
    # index file there, and 403s instead of reaching the flat file.
    location / {
        # The final =404 matters: naming /404.html here instead would serve the
        # error page with a 200 status. error_page below renders it with a true 404.
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Hashed build assets are immutable — the filename changes when content does.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must not be cached, or clients keep an old page referencing chunks
    # that no longer exist after a redeploy.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
